# ============================================
# Configuração Nginx para Backend NFC-e
# ============================================
# Instalar Nginx: sudo apt install nginx (Linux) ou brew install nginx (Mac)
# Colocar este arquivo em: /etc/nginx/sites-available/nfce-backend
# Criar link simbólico: sudo ln -s /etc/nginx/sites-available/nfce-backend /etc/nginx/sites-enabled/
# Testar: sudo nginx -t
# Reiniciar: sudo systemctl restart nginx

# Limite de requisições
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream para o servidor Python
upstream nfce_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Redirecionar HTTP para HTTPS
server {
    listen 80;
    server_name seu-dominio.com www.seu-dominio.com;
    
    # Redirecionar tudo para HTTPS
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    server_name seu-dominio.com www.seu-dominio.com;

    # ============================================
    # SSL/TLS Configuration
    # ============================================
    # Certificados SSL (usar Let's Encrypt ou certificado comercial)
    ssl_certificate /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    
    # Configurações SSL modernas e seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # ============================================
    # Segurança
    # ============================================
    # Ocultar versão do Nginx
    server_tokens off;
    
    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # ============================================
    # Logs
    # ============================================
    access_log /var/log/nginx/nfce-backend-access.log;
    error_log /var/log/nginx/nfce-backend-error.log;
    
    # ============================================
    # Limites
    # ============================================
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # ============================================
    # Proxy para Backend Python
    # ============================================
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy settings
        proxy_pass http://nfce_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Health check endpoint (sem rate limiting)
    location /health {
        proxy_pass http://nfce_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|sql|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}


























