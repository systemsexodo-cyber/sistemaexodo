# Cloud Build configuration para a Bridge NFC-e Exodo (Python)
steps:
  # 1. Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/exodo-nfce-bridge:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/exodo-nfce-bridge:latest'
      - '.'

  # 2. Push da imagem para Container Registry (ou Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/exodo-nfce-bridge:latest'

  # 3. Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'exodo-nfce-bridge'
      - '--image'
      - 'gcr.io/$PROJECT_ID/exodo-nfce-bridge:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'exodo-nfce-bridge-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'CLOUD_RUN=true'

images:
  - 'gcr.io/$PROJECT_ID/exodo-nfce-bridge:latest'
