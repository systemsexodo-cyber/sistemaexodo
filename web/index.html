<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- =================================================================
       VIEWPORT MOBILE - SOMENTE WEB / FIREBASE HOSTING
       Sem esta meta o navegador do celular renderiza o site na largura
       de desktop (aprox. 980px) e depois encolhe. Por isso, no celular,
       a tela abria "espremida" no layout de PC e os botoes de VOLTAR e
       FINALIZAR VENDA ficavam fora da area visivel.
       Esta alteracao mexe apenas no site (Flutter Web / Firebase
       Hosting). O aplicativo Windows NAO usa este arquivo, entao nada
       muda na versao instalada.
       ================================================================= -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sistema Êxodo - Sistema de gestão empresarial completo">
  <meta name="google-signin-client_id"
    content="767835275358-ar47lvn9uboh1b12s2tvqli7epq8ttu0.apps.googleusercontent.com">

  <!-- Meta tags para prevenir cache agressivo do index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Êxodo Systems">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <title>Êxodo Systems</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0d13;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
