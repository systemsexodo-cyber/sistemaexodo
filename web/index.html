<html>

<head>
  <!--

    href value below to reflect the base path you are serving from.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema Êxodo - Sistema de gestão empresarial completo">
  <meta name="google-signin-client_id"
    content="767835275358-ar47lvn9uboh1b12s2tvqli7epq8ttu0.apps.googleusercontent.com">

  <!-- Meta tags para prevenir cache agressivo do index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Êxodo Systems">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <title>Êxodo Systems</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    // SOLUÇÃO PARA LIMPEZA DE CACHE E SERVICE WORKERS OBSOLETOS
    // Versão: 1.0.1 - Força limpeza em cada carregamento
    (function () {
      // 1. Desregistrar todos os Service Workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function (success) {
              if (success) console.log('>>> [CACHE] Service Worker removido com sucesso');
            });
          }
        });
      }

      // 2. Limpar Caches da API de Cache (comum em PWAs Flutter)
      if (window.caches) {
        caches.keys().then(function (names) {
          for (let name of names) {
            caches.delete(name).then(function () {
              console.log('>>> [CACHE] Cache deletado: ' + name);
            });
          }
        });
      }

      // 3. Limpeza de LocalStorage antigo se necessário (opcional)
      // localStorage.removeItem('flutter.some_old_key');
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
