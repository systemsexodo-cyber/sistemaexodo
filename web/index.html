<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- =================================================================
       VIEWPORT MOBILE - SOMENTE WEB / FIREBASE HOSTING
       Sem esta meta o navegador do celular renderiza o site na largura
       de desktop (aprox. 980px) e depois encolhe. Por isso, no celular,
       a tela abria "espremida" no layout de PC e os botoes de VOLTAR e
       FINALIZAR VENDA ficavam fora da area visivel.
       Esta alteracao mexe apenas no site (Flutter Web / Firebase
       Hosting). O aplicativo Windows NAO usa este arquivo, entao nada
       muda na versao instalada.
       ================================================================= -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sistema Êxodo - Sistema de gestão empresarial completo">
  <meta name="google-signin-client_id"
    content="767835275358-ar47lvn9uboh1b12s2tvqli7epq8ttu0.apps.googleusercontent.com">

  <!-- Meta tags para prevenir cache agressivo do index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Êxodo Systems">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <title>Êxodo Systems</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0d13;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ----------------------------------------------------------
       TELA DE ESPERA
       O body fica vazio ate o Flutter terminar de baixar/inicializar o
       bundle (~11 MB). Sem isto o usuario via so o fundo #0b0d13 e achava
       que o sistema estava travado ("tela so fica preta, nao inicia").
       Some quando a <flutter-view> aparece.
       ---------------------------------------------------------- */
    #exodo-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #0b0d13;
      z-index: 9999;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #exodo-loading .anel {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #4cc2ff;
      animation: exodo-girar 0.9s linear infinite;
    }

    #exodo-loading .texto {
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 24px;
    }

    @keyframes exodo-girar {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="exodo-loading" role="status" aria-live="polite">
    <div class="anel"></div>
    <div class="texto">Carregando sistema...</div>
  </div>

  <script>
    // Esconde a tela de espera quando o Flutter cria a <flutter-view>.
    (function () {
      var el = document.getElementById("exodo-loading");
      if (!el) return;

      var vigia = setInterval(function () {
        if (document.querySelector("flutter-view")) {
          clearInterval(vigia);
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 150);
        }
      }, 100);

      // Conexao lenta: avisa que ainda esta tentando em vez de deixar tudo
      // preto sem explicacao (o vigia continua rodando ate o app abrir).
      setTimeout(function () {
        var tx = el.querySelector(".texto");
        if (tx) tx.textContent = "Ainda carregando... verifique sua conexao";
      }, 25000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
