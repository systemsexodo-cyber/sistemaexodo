# Heap do Gradle/R8 calibrado para esta máquina (16 GB, com PostgreSQL e
# outras coisas abertas). Com -Xmx1G o R8 estourava a memória no build de
# release (java_pidXXXX.hprof); com -Xmx4096m o Windows ficava sem memória
# de commit e matava o daemon. 2 GB é o ponto que fecha o release.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true

# Reduz o pico de memória do R8 (build de release cabe na máquina).
android.enableR8.fullMode=false
