# Proxy público do Evolution API.
#
# O Tailscale Funnel entrega /evolution/* aqui. O prefixo é removido antes de
# chegar na API (ela serve tudo na raiz). As rotas sem prefixo também são
# repassadas, para o caso de o Funnel não repassar o caminho como esperado.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8093;
    server_name _;

    # envio de mídia vai em base64 no corpo JSON
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # QR Code / envio de arquivo podem demorar
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering       off;

    location = /evolution {
        return 308 /evolution/;
    }

    # /evolution/instance/create -> /instance/create
    location /evolution/ {
        rewrite ^/evolution/(.*)$ /$1 break;
        proxy_pass http://api:8080;
    }

    # fallback: caso o caminho chegue sem o prefixo
    location / {
        proxy_pass http://api:8080;
    }
}
